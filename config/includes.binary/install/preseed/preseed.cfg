# !!!Important!!! There can be only one of each directive!
#   Subsequent instances of the same directive override the previous ones.

# Disable direct root login. `sudo` and `sudo su -` are still available.
d-i passwd/root-login boolean false

# Include all the flavors of repo
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

# Uncomment the following line, if you don't want to have the sources.list
# entry for a DVD/BD installation image active in the installed system
# (entries for netinst or CD images will be disabled anyway, regardless of
# this setting).
d-i apt-setup/disable-cdrom-entries boolean true

# Install tasks (desktop, roles, etc).
# This is a comma separated list.
# TESTING: Uncomment this for production
#tasksel tasksel/first multiselect gnome-desktop,standard

# Uncomment this to add multiarch configuration for i386
# This might not be required. The WINE flatpack can do 32 or 64 bit with the 
#   same install support and most or all of the other 32bit software has 64bit
#   versions.
#d-i apt-setup/multiarch string i386

# Don't run the package selection dialog *AND* don't install any additional packages
#d-i pkgsel/run_tasksel boolean false
#d-i pkgsel/run_tasksel boolean true

# Packages are given as a space separated list
# FIXME: Install required packages instead of test package
#d-i pkgsel/include string ufw sudo
d-i pkgsel/include string pipx

# Added dialout group for serial access
d-i passwd/user-default-groups string users sudo dialout

# This is fairly safe to set, it makes grub install automatically to the UEFI
# partition/boot record if no other operating system is detected on the machine.
d-i grub-installer/only_debian boolean true

# Run some arbitrary command after the rest of the install process.
# This is run in the installer *not* the installed system.
#d-i preseed/late_command string /target/create-dated-flag.sh  /target/preseed-late-command-in-installer.flag

# Run some arbitrary command after the rest of the install process.
# This is run in the installed system.
#d-i preseed/late_command string in-target /create-dated-flag.sh /preseed-late-command-in-target.flag

# Run multiple arbitrary commands in both the installer and target
d-i preseed/late_command string /target/create-dated-flag.sh  /target/preseed-late-command-in-installer.flag; in-target /usr/bin/systemctl enable first-boot.service; in-target /create-dated-flag.sh /preseed-late-command-in-target.flag;

# Opt out of popularity-contest since we're supposed to be offline.
popularity-contest popularity-contest/participate boolean false

# TESTING: comment out the following in production. This is just for convenience.
# Default language and keymap for testing
d-i console-setup/ask_detect boolean false
d-i debconf/language string en_US:en
d-i debian-installer/country string US
d-i debian-installer/fallbacklocale string en_US
d-i debian-installer/language string en
d-i debian-installer/language string en_US:en
d-i debian-installer/locale string en_US
d-i keyboard-configuration/layoutcode string us
d-i keyboard-configuration/modelcode string pc105
d-i keyboard-configuration/xkb-keymap select us
d-i languagechooser/locale string en
# Default timezone for testing
d-i time/zone string US/Eastern
# Pre-can partitioning options for testing
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string lvm
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish 
d-i partman/confirm boolean true 
d-i partman/confirm_nooverwrite boolean true
# Default hostname for testing
d-i netcfg/get_hostname string emcommtools
d-i netcfg/get_domain string
# Default apt settings for testing
d-i apt-setup/use_mirror boolean true
d-i mirror/country string US
d-i mirror/http/mirror select deb.debian.org
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
tasksel tasksel/first multiselect ssh-server
# Auto install grub to the test VM's hard drive for testing.
#   This is super dangerous outside of a controlled environment.
d-i grub-installer/bootdev  string /dev/sda
# Set the primary user's name human name.
d-i passwd/user-fullname string Example Ham N0CALL
# Set the primary user's username
d-i passwd/username string ham
# Set the default password for the primary user.
# This might be useful for testing and production line installing but is 
#   otherwise probably a bad idea.
# Use `mkpasswd -m sha512crypt` to encrypt the password.
#   `mkpasswd` is in the `whois` package.
#   The hash below is for the password "default"
d-i passwd/user-password-crypted password $6$2BlvZvC447.AfXbZ$MZ8hEjq0v8yGtFnCch75BaUIASvYjofFN7asl3.2.AuaHHiJr1yGfO0noKSTh1smbGwhKElIdBC4/.PLM/cqm1 
# Or just put the password in plaintext
# d-i passwd/user-password password default
# d-i passwd/user-password-again password default
# Don't confirm reboot/shutdown
d-i finish-install/reboot_in_progress note
# Automatically eject the CD from the VM
d-i cdrom-detect/eject boolean true
# Power down instead of rebooting
d-i debian-installer/exit/poweroff boolean true
# END TESTING: comment out in production. This is just for convenience.

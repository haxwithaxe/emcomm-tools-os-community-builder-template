# Default timezone for testing
d-i time/zone string US/Eastern
d-i tzdata/Zones/America select US/Eastern
# Pre-can partitioning options for testing
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string lvm
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-partitioning/choose_label string gpt
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
# Default hostname for testing
d-i netcfg/get_hostname string emcommtools
d-i netcfg/get_domain string
# Default apt settings for testing
d-i apt-setup/use_mirror boolean true
d-i mirror/country string US
d-i mirror/http/mirror select deb.debian.org
d-i mirror/http/proxy string
d-i apt-setup/cdrom/set-first boolean false
d-i tasksel/first multiselect ssh-server
# Auto install grub to the test VM's hard drive for testing.
# This is super dangerous outside of a controlled environment.
d-i grub-installer/bootdev string /dev/sda
# Set the primary user's name human name.
d-i passwd/user-fullname string Example Ham N0CALL
# Set the primary user's username
d-i passwd/username string ham
# Set the default password for the primary user.
# This might be useful for testing and production line installing but is
# otherwise probably a bad idea.
# Use `mkpasswd -m sha512crypt` to encrypt the password.
# `mkpasswd` is in the `whois` package.
# The hash below is for the password "default"
d-i passwd/user-password-crypted password $6$2BlvZvC447.AfXbZ$MZ8hEjq0v8yGtFnCch75BaUIASvYjofFN7asl3.2.AuaHHiJr1yGfO0noKSTh1smbGwhKElIdBC4/.PLM/cqm1
# Or just put the password in plaintext
#d-i passwd/user-password password default
#d-i passwd/user-password-again password default
# Don't confirm reboot/shutdown
d-i finish-install/reboot_in_progress note
# Automatically eject the CD from the VM
#d-i cdrom-detect/eject boolean true
# Power down instead of rebooting
#d-i debian-installer/exit/poweroff boolean true

# !!!Important!!! There can be only one of each directive!
# Subsequent instances of the same directive override the previous ones.
# Any option that appears in both preseed.cfg and this file will use the value
# in this file.

# Do some stuff before ending the installer
# * Set flags for mapping first in the installer environment then in the 
# installed OS chroot.
# * Enable the first-boot systemd service
d-i preseed/late_command string /target/create-dated-flag.sh /target/preseed-late-command-in-installer.flag; in-target /create-dated-flag.sh /preseed-late-command-in-target.flag; in-target /usr/bin/systemctl enable first-boot.service;

# TESTING: comment out the following in production. This is just for convenience.
keyboard-configuration keyboard-configuration/altgr select The default for the keyboard layout
keyboard-configuration keyboard-configuration/compose select No compose key
keyboard-configuration keyboard-configuration/ctrl_alt_bksp boolean false
keyboard-configuration keyboard-configuration/layout select 
keyboard-configuration keyboard-configuration/layoutcode string us
keyboard-configuration keyboard-configuration/model select Generic 105-key PC
keyboard-configuration keyboard-configuration/modelcode string pc105
keyboard-configuration keyboard-configuration/optionscode string 
keyboard-configuration keyboard-configuration/store_defaults_in_debconf_db boolean true
keyboard-configuration keyboard-configuration/switch select No temporary switch
keyboard-configuration keyboard-configuration/toggle select No toggling
keyboard-configuration keyboard-configuration/unsupported_config_layout boolean true
keyboard-configuration keyboard-configuration/unsupported_config_options boolean true
keyboard-configuration keyboard-configuration/unsupported_layout boolean true
keyboard-configuration keyboard-configuration/unsupported_options boolean true
keyboard-configuration keyboard-configuration/variant select English (US)
keyboard-configuration keyboard-configuration/variantcode string 
keyboard-configuration keyboard-configuration/xkb-keymap select us

languagechooser languagechooser/locale string en
locales locales/default_environment_locale select en_US.UTF-8
locales locales/locales_to_be_generated multiselect en_US.UTF-8

d-i time/zone string US/Eastern
tzdata tzdata/Zones/America select US/Eastern


tasksel tasksel/first multiselect ssh-server
apt-setup apt-setup/use_mirror boolean true
apt-setup apt-setup/cdrom/set-first boolean false


# Default language and keymap for testing
d-i console-setup/ask_detect boolean false
d-i debconf/language string en_US:en
d-i debian-installer/country string US
d-i debian-installer/fallbacklocale string en_US.UTF-8
d-i debian-installer/language string en
